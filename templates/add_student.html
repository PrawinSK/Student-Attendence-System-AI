<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student | Smart Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .container { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 24px; text-align: center; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; }
    .alert.success { background: #065f46; color: #6ee7b7; }
    .alert.error { background: #7f1d1d; color: #fca5a5; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, select { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .nav-links { margin-top: 20px; text-align: center; font-size: 14px; }
    .nav-links a { color: #38bdf8; text-decoration: none; margin: 0 10px; }
    .nav-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="container">
  <h2>Register New Student</h2>
  {% if success %}
    <div class="alert success">{{ success }}</div>
  {% endif %}
  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="e.g., John Doe">
    </div>
    <div class="form-group">
      <label for="register_number">Register Number</label>
      <input type="text" id="register_number" name="register_number" required placeholder="e.g., 11224001">
    </div>
    <div class="form-group">
      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="CS">Computer Science (CS)</option>
        <option value="IT">Information Technology (IT)</option>
        <option value="EEE">Electrical (EEE)</option>
        <option value="MECH">Mechanical (MECH)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="year">Year</label>
      <select id="year" name="year" required>
        <option value="1">Year 1</option>
        <option value="2">Year 2</option>
        <option value="3">Year 3</option>
        <option value="4" selected>Year 4</option>
      </select>
    </div>
    <div class="form-group">
      <label for="image">Reference Photo (Portrait Face)</label>
      <input type="file" id="image" name="image" accept="image/*" required>
    </div>
    <button type="submit">Enroll Face & Save</button>
  </form>
  <div class="nav-links">
    <a href="/">Take Attendance</a> •
    <a href="/hod_dashboard">HOD Dashboard</a>
  </div>
</div>
</body>
</html>
